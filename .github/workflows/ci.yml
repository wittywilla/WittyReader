# Began as module-kit's, and now has the desktop app's test too: don't generate it again over this.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, and no secret is used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --if-present
      - run: npm run build
      - name: The desktop app's own tests
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
