# Began as module-kit's, and now builds the desktop installers too: don't generate it again over this.
#
# A version tag publishes a release: the zip of the web app for people who host it themselves, and
# an installer for each system. Nothing is signed yet: see the wiki's Installing and removing page. Tags with a suffix such as -beta are prereleases.
name: release
on:
  push:
    tags: ["v*"]

# Every job asks for only what it needs: code from a dependency can run during a
# build, and must not find a token that can publish, or the signing key.
permissions: {}

jobs:
  # On a machine of their own: a test runs whatever it likes, and could otherwise
  # change what gets packed.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test --if-present
      - name: The desktop app's own tests
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test

  # From a fresh checkout, running no tests.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
          desktop="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/package.json | head -1)"
          [ "$desktop" = "$want" ] || { echo "desktop/package.json says $desktop, and package.json says $want"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Pack the built app
        run: |
          mkdir release
          name="wittyreader-${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../release/$name.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-app
          path: release/*
          if-no-files-found: error

  # From a fresh checkout on each system, running no tests. Nothing here is signed.
  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux }
          - { os: windows-latest, target: --win }
          - { os: macos-latest, target: --mac }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tool that makes the .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the web app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx electron-builder ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/*.rpm
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: [build, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      - name: Write the checksum list
        run: cd release && sha256sum -- * > "../wittyreader-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" && mv "../wittyreader-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
